
name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          GRADLE_FILE=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: ZIP does not contain a recognizable Gradle Android project"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StakeHelper-Debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
